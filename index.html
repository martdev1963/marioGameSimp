<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Frills Mario </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍄 Simple 2d Mario game 🍄</h1>
<h4>🖧 Powered by MAB Media Software Systems 🖧</h4>
    
<div class="game-container">
<!-- UI showing levels, lives, etc... -->
    <div class="ui">
        <p>Score: <span id="score">0</span></p>
        <p>Lives: <span id="lives">3</span></p>
        <p>Level: <span id="level">1</span></p>

    </div>

    <!-- Game area where Mario and other elements will be rendered Dynamically -->
    <div id="game-area">
        <div id="mario"></div>
    </div>

    <div class="controls">
        <p>Controls:</p>a
        <p>Arrow Keys: Move Left/Right/Space key: to jump</p>
        <p>Down Arrow: Enter Pipe (when on top of it)</p>
    </div>
</div>

<!-- Enemy collision sound effect -->
<audio id="enemy-fart-sound">
    <source src="audio/enemyFart.wav" type="audio/wav">
</audio>

<!-- Jump/Bounce sound effect -->
<audio id="bounce-sound">
    <source src="audio/marioBounce.wav" type="audio/wav">
</audio>

<!-- Collection sound effect -->
<audio id="collection-sound">
    <source src="audio/collectionSound.wav" type="audio/wav">
</audio>

<!-- Background music -->
<audio id="background-music" loop>
    <source src="audio/marioTheme.wav" type="audio/wav">
</audio>

<!-- Next level sound effect -->
<audio id="next-level-sound">
    <source src="audio/nextLevel.wav" type="audio/wav">
</audio>

<!-- Win sound effect -->
<audio id="win-sound">
    <source src="audio/winSound.wav" type="audio/wav">
</audio>

<!-- Lose sound effect -->
<audio id="lose-sound">
    <source src="audio/loseSound.wav" type="audio/wav">
</audio>

<div id="game-over">
    <h2 id="game-over-title">Game Over</h2>
    <p>Score:<span id="final-score">0</span></p>
    <button id="restart-button">Play Again</button>
</div>

<script src="app.js"></script>
</body>
</html>
